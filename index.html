<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Eevie's Zero Game</title>
<meta name="theme-color" content="#FFD6EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zero Game">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --ink:#1F3C78;      /* deep-sea navy: all text */
  --sea:#2C6FB7;
  --lagoon:#7FD3F7;
  --shell:#FFB8DD;
  --gum:#FF5FA8;
  --pearl:#FFF8FC;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,#FFD6EC 0%,#FFE8F4 34%,#D4F1FF 62%,#93D9F8 100%);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sea);outline-offset:4px}

/* ambient sea */
.waves{position:absolute;left:0;right:0;bottom:0;height:22vh;width:100%;pointer-events:none}
.amb{position:absolute;bottom:-60px;border-radius:50%;border:3px solid rgba(255,255,255,.75);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.9) 0 12%,rgba(255,255,255,0) 14%);
  animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-115vh)}}

#app{position:absolute;inset:0;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen.active{display:flex}

/* the zero ring, used on title, in rounds, and at the finale */
.zero-ring ellipse{fill:none;stroke:url(#iris);stroke-width:13}
.zero-ring .edge{fill:none;stroke:#fff;stroke-width:16}

/* ---------- title ---------- */
#title{justify-content:center;gap:min(3.5vh,26px);text-align:center}
.hero{position:relative;height:min(42vh,62vmin,400px);aspect-ratio:1.15;display:flex;align-items:center;justify-content:center}
.hero .zero-ring{height:100%;width:auto;overflow:visible;filter:drop-shadow(0 10px 0 rgba(31,60,120,.12));animation:ringIn .9s cubic-bezier(.3,1.6,.5,1) both}
.hero .pal{position:absolute;bottom:4%;font-size:min(16vh,22vmin,140px);line-height:1;filter:drop-shadow(0 6px 0 rgba(31,60,120,.12))}
.hero .pal.l{left:-2%;animation:inL .8s .35s cubic-bezier(.3,1.5,.5,1) both}
.hero .pal.r{right:-2%;animation:inR .8s .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes ringIn{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@keyframes inL{from{transform:translateX(-60%) rotate(-30deg);opacity:0}}
@keyframes inR{from{transform:translateX(60%) rotate(30deg);opacity:0}}
h1{margin:0;font-size:clamp(34px,8.5vmin,66px);font-weight:900;line-height:1.05;letter-spacing:.005em;
  text-shadow:0 4px 0 #fff,0 8px 0 var(--shell)}
.play{width:min(28vmin,18vh,160px);aspect-ratio:1;border-radius:50%;border:6px solid #fff;
  background:radial-gradient(circle at 35% 30%,#FF9ACB,var(--gum) 62%,#E8448F);
  box-shadow:0 8px 0 #C83478,0 16px 28px rgba(200,52,120,.35);display:grid;place-items:center;
  animation:breathe 2.2s ease-in-out infinite}
.play svg{width:42%;height:42%;margin-left:9%}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #C83478}
@keyframes breathe{50%{transform:scale(1.07)}}
.grownups{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:16px;right:16px;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--sea)}
.grownups p{margin:0;max-width:34em;background:rgba(255,255,255,.7);padding:6px 14px;border-radius:14px}
.grownups button{border:2px solid var(--sea);background:#fff;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800}

/* ---------- game ---------- */
.bar{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 0}
.icon-btn{width:min(11vmin,52px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.75);
  font-size:min(5.5vmin,26px);display:grid;place-items:center;box-shadow:0 3px 0 rgba(31,60,120,.15);padding:0}
.stickers{display:flex;gap:min(1vmin,6px)}
.slot{width:min(7vmin,40px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.5);
  border:2px dashed rgba(44,111,183,.35);display:grid;place-items:center;font-size:min(4.6vmin,24px);line-height:1}
.slot.filled{border:2px solid #fff;background:#fff;animation:slotPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes slotPop{from{transform:scale(.3)}}
.caption{margin:10px 16px 0;min-height:calc(2.5em + 16px);max-width:640px;width:calc(100% - 32px);padding:8px 18px;
  background:rgba(255,255,255,.82);border-radius:24px;font-size:clamp(17px,4.6vmin,28px);font-weight:800;line-height:1.25;
  display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 0 rgba(255,95,168,.22)}
.scene{flex:1;min-height:0;width:100%;max-width:980px;display:grid;grid-template-rows:auto minmax(0,1fr);
  align-items:center;justify-items:center;padding:6px 16px;gap:4px}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .scene{grid-template-rows:minmax(0,1fr);grid-template-columns:1fr 1.7fr}
}
.friend{display:flex;flex-direction:column;align-items:center}
.friend .face{display:inline-block;font-size:min(30vmin,16vh,170px);line-height:1;filter:drop-shadow(0 6px 0 rgba(31,60,120,.12))}
.friend .tag{margin-top:2px;font-size:clamp(14px,3.4vmin,21px);font-weight:800;background:var(--pearl);color:var(--sea);
  padding:2px 14px;border-radius:999px;border:2px solid var(--shell)}
.friend.enter .face{animation:hop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hop{from{transform:translateY(40%) scale(.4);opacity:0}}
.spot{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}

/* plate */
.plate-wrap{--h:min(46vmin,28vh,270px);position:relative;height:var(--h);width:min(100%,calc(var(--h)*2.3))}
.plate{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:100%;height:40%;border-radius:50%;
  border:min(2.4vmin,14px) solid var(--shell);box-shadow:0 8px 0 rgba(31,60,120,.12);
  transition:width .7s cubic-bezier(.4,1.5,.5,1),height .7s cubic-bezier(.4,1.5,.5,1),bottom .7s,border-width .7s,border-color .5s,opacity .4s .6s}
.plate::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 50% 45%,#fff 0 58%,#FFF0F8 60% 100%);transition:opacity .35s}
.plate-wrap .zero-ring{position:absolute;left:50%;top:0;height:100%;width:auto;transform:translateX(-50%) scale(.9);opacity:0;
  overflow:visible;transition:opacity .35s .55s,transform .5s .55s cubic-bezier(.3,1.8,.5,1);pointer-events:none}
.plate-wrap.to-zero .plate{width:calc(var(--h)*.66);height:100%;bottom:0;border-width:calc(var(--h)*.13);border-color:var(--gum);opacity:0}
.plate-wrap.to-zero .plate::before{opacity:0}
.plate-wrap.to-zero .zero-ring{opacity:1;transform:translateX(-50%) scale(1)}
.plate-wrap.to-zero .treats{opacity:0}
.treats{position:absolute;left:0;right:0;bottom:21%;display:flex;justify-content:center;align-items:flex-end;gap:min(2vmin,14px);transition:opacity .3s}
.treat{font-size:min(17vmin,11vh,110px);line-height:1;background:none;border:none;padding:4px;
  filter:drop-shadow(0 5px 0 rgba(31,60,120,.15));animation:drop .45s cubic-bezier(.3,1.6,.5,1) both}
.treat.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.treat.gone{visibility:hidden;pointer-events:none}
.treat.jump{animation:jump .5s ease-in-out 3}
@keyframes drop{from{transform:translateY(-120%) scale(.5);opacity:0}}
@keyframes wiggle{0%,60%,100%{transform:rotate(0) scale(1)}70%{transform:rotate(-12deg) scale(1.08)}80%{transform:rotate(10deg) scale(1.08)}90%{transform:rotate(-6deg)}}
@keyframes jump{50%{transform:translateY(-30%) scale(1.1)}}

/* bubbles */
.bubble-zone{position:relative;width:min(100%,560px);height:100%;max-height:520px;min-height:150px}
.bubble{position:absolute;width:min(27vmin,17vh,160px);aspect-ratio:1;border-radius:50%;border:none;padding:0;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 11%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.1) 50%,rgba(255,184,221,.6) 68%,rgba(127,211,247,.8) 86%,rgba(255,255,255,.95) 100%);
  box-shadow:inset 0 0 18px rgba(255,255,255,.7),0 6px 16px rgba(44,111,183,.18);
  animation:bob 3.2s ease-in-out infinite}
.bubble.born{animation:blowIn .6s cubic-bezier(.3,1.6,.5,1) both,bob 3.2s .6s ease-in-out infinite}
@keyframes blowIn{from{transform:translate(-50%,-50%) scale(.1);opacity:0}}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.bubble-zone .zero-ring{position:absolute;left:50%;top:50%;height:92%;width:auto;overflow:visible;
  transform:translate(-50%,-50%) scale(.3);opacity:0;transition:transform .6s cubic-bezier(.3,1.7,.5,1),opacity .3s;pointer-events:none}
.bubble-zone.to-zero .zero-ring{transform:translate(-50%,-50%) scale(1);opacity:1}

/* answers */
.answers{display:flex;justify-content:center;align-items:center;gap:min(4vmin,26px);
  padding:4px 12px calc(14px + env(safe-area-inset-bottom,0px));min-height:calc(min(26vmin,16vh,150px) + 22px)}
.ans{width:min(26vmin,16vh,150px);aspect-ratio:1;border-radius:50%;border:min(1.3vmin,7px) solid #fff;padding:0;
  background:radial-gradient(circle at 35% 30%,#fff,#FFF2F9 60%,#FFE1F0);
  box-shadow:0 6px 0 rgba(44,111,183,.25),0 0 0 min(.9vmin,5px) var(--lagoon);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  animation:popIn .45s cubic-bezier(.3,1.7,.5,1) both;transition:opacity .3s,transform .3s}
.ans .num{font-size:min(12vmin,8.5vh,78px);font-weight:900;line-height:.95}
.ans .mini{display:flex;align-items:center;justify-content:center;gap:1px;height:1.2em;font-size:min(3.8vmin,2.8vh,22px);line-height:1}
.mini-plate{width:2.2em;height:.85em;border-radius:50%;border:.17em solid var(--shell);background:#fff}
.mini-bub{width:.8em;height:.8em;border-radius:50%;border:2px solid var(--lagoon);background:rgba(255,255,255,.8);margin:0 1px}
.ans.right{box-shadow:0 6px 0 rgba(255,95,168,.35),0 0 0 min(1.3vmin,7px) var(--gum),0 0 34px rgba(255,95,168,.6);animation:yes .6s cubic-bezier(.3,1.7,.5,1) both}
.ans.wrong{animation:no .5s;opacity:.4;pointer-events:none}
.ans.hint{animation:hint 1s ease-in-out infinite}
.answers.done .ans:not(.right){opacity:.2;transform:scale(.8)}
@keyframes popIn{from{transform:scale(.2);opacity:0}}
@keyframes yes{50%{transform:scale(1.22)}to{transform:scale(1.1)}}
@keyframes no{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes hint{50%{transform:scale(1.14);box-shadow:0 6px 0 rgba(44,111,183,.25),0 0 0 min(1.3vmin,7px) var(--gum),0 0 30px rgba(255,95,168,.55)}}

/* ---------- finale ---------- */
#finale{justify-content:center;gap:min(3vh,22px);text-align:center;padding-left:16px;padding-right:16px}
.final-hero{position:relative;height:min(44vh,64vmin,420px);aspect-ratio:.8}
.final-hero .zero-ring{position:absolute;left:50%;top:50%;height:86%;width:auto;transform:translate(-50%,-50%);overflow:visible}
.final-hero .st{position:absolute;transform:translate(-50%,-50%);font-size:min(9vh,11vmin,64px);line-height:1;
  filter:drop-shadow(0 4px 0 rgba(31,60,120,.15));animation:popIn .5s cubic-bezier(.3,1.8,.5,1) both}
.final-hero .pal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(12vh,15vmin,100px);animation:dance 1s ease-in-out infinite}
@keyframes dance{25%{transform:translate(-50%,-56%) rotate(-10deg)}75%{transform:translate(-50%,-56%) rotate(10deg)}}
.final-actions{display:flex;flex-direction:column;align-items:center;gap:8px}
.final-actions small{font-size:15px;font-weight:800;color:var(--sea)}

/* ---------- effects layer ---------- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.fx-piece{position:absolute;line-height:1;will-change:transform}
.crumb{position:absolute;width:10px;height:10px;border-radius:50%}
.hand{position:absolute;font-size:min(12vmin,64px);line-height:1;animation:point .8s ease-in-out infinite}
@keyframes point{50%{transform:translateY(-14px)}}

@media (prefers-reduced-motion:reduce){
  .amb,.play,.treat.wiggle,.bubble,.final-hero .pal{animation:none}
  .bubble.born{animation:none}
}
</style>
</head>
<body>

<!-- shared gradient for every zero ring -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF5FA8"/>
      <stop offset=".3" stop-color="#FFB8DD"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset=".72" stop-color="#7FD3F7"/>
      <stop offset="1" stop-color="#2C6FB7"/>
    </linearGradient>
  </defs>
</svg>

<svg class="waves" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 60 C150 20 300 100 450 60 S750 20 900 60 S1100 100 1200 60 V200 H0Z" fill="#7CCDF3" opacity=".35"/>
  <path d="M0 110 C200 70 350 150 600 110 S1000 70 1200 110 V200 H0Z" fill="#5FBDEB" opacity=".3"/>
</svg>
<div class="amb" style="left:8%;width:22px;height:22px;animation-duration:17s"></div>
<div class="amb" style="left:27%;width:14px;height:14px;animation-duration:13s;animation-delay:-6s"></div>
<div class="amb" style="left:63%;width:30px;height:30px;animation-duration:21s;animation-delay:-11s"></div>
<div class="amb" style="left:84%;width:18px;height:18px;animation-duration:15s;animation-delay:-3s"></div>

<div id="app">
  <section id="title" class="screen active" aria-label="Start">
    <div class="hero">
      <svg class="zero-ring" viewBox="0 0 66 100" aria-hidden="true">
        <ellipse class="edge" cx="33" cy="50" rx="25" ry="41"/><ellipse cx="33" cy="50" rx="25" ry="41"/>
      </svg>
      <span class="pal l" aria-hidden="true">🦄</span>
      <span class="pal r" aria-hidden="true">🧜‍♀️</span>
    </div>
    <h1 id="titleText">Eevie's Zero Game</h1>
    <button class="play" id="playBtn" aria-label="Play">
      <svg viewBox="0 0 10 12" aria-hidden="true"><path d="M1 1.2 L9 6 L1 10.8Z" fill="#fff" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <div class="grownups">
      <button id="installBtn" hidden>Install for offline play</button>
      <p id="iosNote" hidden>Grown-ups: in Safari, tap Share, then Add to Home Screen to play offline.</p>
      <p id="offlineNote" hidden>Saved on this device. Works without internet.</p>
    </div>
  </section>

  <section id="game" class="screen" aria-label="Game">
    <div class="bar">
      <button class="icon-btn" id="homeBtn" aria-label="Back to start">🏠</button>
      <div class="stickers" id="stickers" aria-label="Stickers earned"></div>
      <button class="icon-btn" id="soundBtn" aria-label="Sound on">🔊</button>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="scene">
      <div class="friend" id="friend"><span class="face" id="face"></span><span class="tag" id="tag"></span></div>
      <div class="spot" id="spot"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <section id="finale" class="screen" aria-label="All done">
    <div class="final-hero" id="finalHero">
      <svg class="zero-ring" viewBox="0 0 66 100" aria-hidden="true">
        <ellipse class="edge" cx="33" cy="50" rx="25" ry="41"/><ellipse cx="33" cy="50" rx="25" ry="41"/>
      </svg>
      <span class="pal" aria-hidden="true">🦄</span>
    </div>
    <h1 id="finalText"></h1>
    <div class="final-actions">
      <button class="play" id="againBtn" aria-label="Play again">
        <svg viewBox="0 0 10 12" aria-hidden="true"><path d="M1 1.2 L9 6 L1 10.8Z" fill="#fff" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
      <small>Play again</small>
    </div>
  </section>
</div>
<div id="fx" aria-hidden="true"></div>

<script>
(() => {
'use strict';

/* ================= personalize here ================= */
const KID = 'Eevie';
const FRIENDS = [
  { emoji: '🦄', name: 'the unicorn', label: 'Unicorn', bubbles: true },
  { emoji: '🧜‍♀️', name: 'the mermaid', label: 'Mermaid', bubbles: true },
  { emoji: '👨', name: 'Daddy', label: 'Daddy', bubbles: false },
  { emoji: '🐬', name: 'the dolphin', label: 'Dolphin', bubbles: true },
];
const TREATS = [
  { emoji: '🍎', one: 'apple', many: 'apples' },          // always first, like at school
  { emoji: '🧁', one: 'cupcake', many: 'cupcakes' },
  { emoji: '🍓', one: 'strawberry', many: 'strawberries' },
  { emoji: '🍩', one: 'donut', many: 'donuts' },
  { emoji: '🍪', one: 'cookie', many: 'cookies' },
  { emoji: '🫐', one: 'blueberry', many: 'blueberries' },
  { emoji: '🍭', one: 'lollipop', many: 'lollipops' },
  { emoji: '🍦', one: 'ice cream cone', many: 'ice cream cones' },
];
const STICKERS = ['🦄', '🐚', '🌈', '🧜‍♀️', '⭐', '🦋', '💎', '💖'];
/* ==================================================== */

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const WORDS = ['zero', 'one', 'two', 'three', 'four'];
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

const caption = $('#caption'), face = $('#face'), tag = $('#tag'), friendEl = $('#friend');
const spot = $('#spot'), answersEl = $('#answers'), fx = $('#fx'), stickersEl = $('#stickers');

$('#titleText').textContent = `${KID}'s Zero Game`;
document.title = `${KID}'s Zero Game`;

let muted = false;
try { muted = localStorage.getItem('zero-muted') === '1'; } catch (e) {}

/* ---------------- sounds (made in code, so they work offline) ---------------- */
const sfx = (() => {
  let ctx = null, noiseBuf = null, active = null;
  const stopClip = () => { if (active) { try { active.stop(); } catch (e) {} } };
  const ac = () => {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (f, d, o = {}) => {
    if (muted) return; const c = ac(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.18, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + d + 0.05);
  };
  const noise = (d, o = {}) => {
    if (muted) return; const c = ac(); if (!c) return;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 0.5), c.sampleRate);
      const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf; f.type = o.ftype || 'lowpass'; f.frequency.value = o.freq || 900;
    g.gain.setValueAtTime(o.vol || 0.3, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

    chomp: () => { noise(0.09, { freq: 700, vol: 0.45 }); noise(0.09, { freq: 600, vol: 0.4, at: 0.14 }); },

let zeroBuf = null;

const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voice = null, currentUtter = null;
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|grandpa|grandma|rocko|shelley|eddy|flo|reed|sandy/i;
function chooseVoice() {
  if (!synth) return null;
  const all = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name));
  const local = all.filter(v => v.localService);
  const vs = local.length ? local : all;
  const prefs = [/samantha/i, /\bava\b/i, /allison/i, /susan/i, /aria/i, /jenny/i, /zira/i, /karen/i, /moira/i, /tessa/i, /serena/i, /female/i];
  for (const p of prefs) { const v = vs.find(x => p.test(x.name)); if (v) return v; }
  return vs.find(x => /en[-_]US/i.test(x.lang)) || vs[0] || null;
}
if (synth) { voice = chooseVoice(); synth.addEventListener && synth.addEventListener('voiceschanged', () => { voice = chooseVoice(); }); }

function speakPart(text) {
  return new Promise(resolve => {
    const est = 900 + text.length * 70;
    if (muted || !synth) { setTimeout(resolve, Math.min(est * 0.7, 2600)); return; }
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(finish, est + 2000);
    const u = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
    u.rate = 0.9; u.pitch = 1.15;
    u.onend = finish; u.onerror = finish;
    currentUtter = u; // keep a reference so Safari doesn't drop the end event
    if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(() => synth.speak(u), 60); }
    else synth.speak(u);
  });
}
let sayId = 0;
async function say(text) {
  caption.textContent = text;

  sfx.stopClip();
  const useClip = !!zeroBuf && !muted;
  const parts = useClip ? text.split(/\b(zero)\b/i) : [text];
  for (const raw of parts) {
    if (me !== sayId) return;                       // a newer line took over
    if (useClip && /^zero$/i.test(raw)) { if (synth) synth.cancel(); await sfx.clip(zeroBuf); continue; }
    const part = parts.length > 1 ? raw.replace(/^[\s.,!?;:\u2026-]+/, '') : raw;

}

function confetti(n = 26) {

  for (let i = 0; i < n; i++) {

      { duration: 1800 + Math.random() * 1400, delay: Math.random() * 350, easing: 'cubic-bezier(.3,.6,.6,1)', fill: 'forwards' })

function burst(x, y, colors, n = 8, dist = 60) {

    fx.append(c);

    c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 20}px) scale(.3)`, opacity: 0 }],
      { duration: 550, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).finished.then(() => c.remove(), () => c.remove());
  }
}
function munch() {
  face.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18,.86)' }, { transform: 'scale(.92,1.1)' }, { transform: 'scale(1.1,.92)' }, { transform: 'scale(1)' }], { duration: 480, easing: 'ease-out' });

/* ---------------- the rounds ---------------- */
function buildPlan() {
  const base = [
    { type: 'chomp', count: 1, eat: 1 },   // exactly the classroom example
    { type: 'chomp', count: 1, eat: 1 },
    { type: 'pop', count: 2 },
    { type: 'chomp', count: 2, eat: 2 },
    { type: 'chomp', count: 2, eat: 1 },   // one left over, so zero means something
    { type: 'pop', count: 3 },
    { type: 'chomp', count: 3, eat: 2 },
    { type: 'chomp', count: 3, eat: 3 },
  ];
  const treats = [TREATS[0], ...shuffle(TREATS.slice(1))];
  let ti = 0, last = null;
  return base.map((r, i) => {
    let friend;
    if (i === 0) friend = FRIENDS[0];
    else friend = pick((r.type === 'pop' ? FRIENDS.filter(f => f.bubbles) : FRIENDS).filter(f => f !== last));
    last = friend;
    return { ...r, friend, treat: r.type === 'chomp' ? treats[ti++] : null, first: i === 0 };
  });
}
function choicesFor(count, ans) {
  if (count === 1) return shuffle([0, 1]);
  const set = new Set([0, ans]);
  for (const n of shuffle([1, 2, 3].filter(n => n <= Math.max(count, 2)))) { if (set.size >= 3) break; set.add(n); }
  return shuffle([...set]);
}
function clearScene() {
  spot.innerHTML = ''; answersEl.innerHTML = ''; answersEl.classList.remove('done'); caption.textContent = ''; clearIdle();
}
function setFriend(f) {
  face.textContent = f.emoji; tag.textContent = f.label;

}
const zeroRingSVG = '<svg class="zero-ring" viewBox="0 0 66 100" aria-hidden="true"><ellipse class="edge" cx="33" cy="50" rx="25" ry="41"/><ellipse cx="33" cy="50" rx="25" ry="41"/></svg>';

async function chompRound(r, w) {
  const t = r.treat, n = r.count, F = r.friend;
  const wrap = el('div', 'plate-wrap');
  wrap.innerHTML = `<div class="plate"></div>${zeroRingSVG}<div class="treats"></div>`;
  spot.append(wrap);
  const row = wrap.querySelector('.treats');
  const items = [];
  let feeding = false, eaten = 0, fedResolve;
  const flights = [], fed = new Promise(res => { fedResolve = res; });
  const tapTreat = b => {
    if (b.dataset.state) return;
    if (!feeding) { // tapped before the friend is ready: a little bounce so it still feels alive
      sfx.plop(0); b.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-18%)' }, { transform: 'translateY(0)' }], { duration: 300 });
      return;
    }
    b.dataset.state = 'eaten'; eaten++; pokeIdle();
    b.classList.remove('wiggle'); b.style.animation = 'none';
    const last = eaten === r.eat;
    if (last) { clearIdle(); items.forEach(x => { if (!x.dataset.state) { x.dataset.state = 'stay'; x.classList.remove('wiggle'); x.style.animation = 'none'; } }); }
    const p = flyInto(b, face).catch(() => {}).then(() => {
      b.classList.add('gone'); sfx.chomp(); munch();
      const c = center(face); burst(c.x, c.y + c.h * 0.15, ['#E9B872', '#FFB8DD', '#C98B4E', '#FF5FA8']);
    });
    flights.push(p);
    if (!last) { p.then(() => say(pick(['Yum!', 'Num num num!', 'Yummy!']))); return; }
    Promise.all(flights).then(fedResolve);
  };
  await w(sleep(250));
  for (let i = 0; i < n; i++) {
    const b = el('button', 'treat'); b.textContent = t.emoji; b.setAttribute('aria-label', t.one);
    onTap(b, () => tapTreat(b));
    row.append(b); items.push(b); sfx.plop(i);
    await w(sleep(300));
  }
  await w(say(`${KID} has ${WORDS[n]} ${n === 1 ? t.one : t.many}.`));
  hop();
  await w(say(`${cap(F.name)} is hungry!`));

  const prompt = `Tap the ${n === 1 ? t.one : t.many} to feed ${F.name}!`;
  feeding = true;
  items.forEach((b, i) => { b.classList.add('wiggle'); b.style.animationDelay = i * 0.2 + 's'; });
  say(prompt);
  setIdle(() => { say(prompt); pointAt(items.find(b => !b.dataset.state)); });
  await w(fed);

  if (r.eat === n) await w(say(pick(['Chomp! Yum yum!', 'Num num num! Yummy!'])));
  else { shakeNo(); await w(say(`${cap(F.name)} is all full!`)); }
  await w(sleep(200));

  const ans = n - r.eat;
  const zeroLines = r.first
    ? [`Zero! ${KID} had one apple, and ${F.name} ate it. Now there are zero apples!`]
    : [`Zero! ${KID} has zero ${t.many}. All gone!`,
       `Zero! The plate is empty. Zero ${t.many}!`,
       `Yes! Zero ${t.many}. ${cap(F.name)} ${n === 1 ? 'ate it up' : 'ate them all'}!`];
  await ask(w, {
    count: n, ans,
    question: `How many ${t.many} does ${KID} have now?`,
    mini: k => k === 0 ? '<span class="mini-plate"></span>' : t.emoji.repeat(k),
    hintLine: ans === 0
      ? `Look at the plate. Are there any ${t.many} left? No! None at all. That's zero!`
      : `Look at the plate. There's still one ${t.one} left. That's one!`,
    winLine: ans === 0 ? pick(zeroLines) : `One! One ${t.one} is still on the plate.`,
    celebrate: () => {
      if (ans === 0) { wrap.classList.add('to-zero'); setTimeout(sfx.sparkle, 550); }
      else items.filter(b => b.dataset.state === 'stay').forEach(b => b.classList.add('jump'));
    },
  });
}

async function popRound(r, w) {
  const n = r.count, F = r.friend;
  const zone = el('div', 'bubble-zone'); zone.innerHTML = zeroRingSVG; spot.append(zone);
  const spots = n === 2 ? [[30, 42], [70, 58]] : [[20, 60], [50, 36], [80, 62]];
  let popped = 0, poppedResolve;
  const anims = [], allPopped = new Promise(res => { poppedResolve = res; });
  const bubbles = [];
  const popIt = b => {   // bubbles can be popped the moment they appear
    if (b.dataset.state) return;
    b.dataset.state = 'popped'; popped++; pokeIdle();
    sfx.pop();
    const c = center(b); burst(c.x, c.y, ['#FFB8DD', '#7FD3F7', '#ffffff', '#FF5FA8'], 10, c.w * 0.7);
    b.style.animation = 'none';
    anims.push(b.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(1.45)', opacity: 0 }],
      { duration: 180, fill: 'forwards' }).finished.catch(() => {}).then(() => { b.style.visibility = 'hidden'; }));

  }
  await w(Promise.race([say(`${cap(F.name)} blew ${WORDS[n]} bubbles!`), allPopped]));
  if (popped < n) {
    const prompt = popped ? 'Pop them all!' : 'Pop the bubbles! Pop them all!';
    say(prompt);
    setIdle(() => { say(prompt); pointAt(bubbles.find(b => !b.dataset.state)); });
  }
  await w(allPopped);

  await w(say(pick(['Pop! Pop!', 'Pop pop pop!'])));
  await ask(w, {
    count: n, ans: 0,
    question: 'How many bubbles are left?',
    mini: k => k === 0 ? '<span class="mini-plate"></span>' : '<span class="mini-bub"></span>'.repeat(k),
    hintLine: 'Look! Are there any bubbles left? No! None at all. That\'s zero!',
    winLine: pick(['Zero! Zero bubbles. You popped them all!', 'Zero! No bubbles left. All gone!']),
    celebrate: () => { zone.classList.add('to-zero'); setTimeout(sfx.sparkle, 300); },
  });
}

async function ask(w, o) {
  const btns = choicesFor(o.count, o.ans).map((k, i) => {
    const b = el('button', 'ans'); b.dataset.n = k; b.style.animationDelay = i * 0.12 + 's';
    b.setAttribute('aria-label', WORDS[k]);
    b.innerHTML = `<span class="num">${k}</span><span class="mini">${o.mini(k)}</span>`;
    answersEl.append(b); return b;
  });
  say(o.question);
  setIdle(() => say(o.question), 9000);

  await w(new Promise(resolve => {
    let busy = false;
    btns.forEach(b => onTap(b, async () => {
      if (busy || b.classList.contains('wrong')) return;
      busy = true; pokeIdle();
      const k = +b.dataset.n;
      if (k === o.ans) {
        clearIdle(); btns.forEach(x => x.classList.remove('hint'));
        b.classList.add('right'); answersEl.classList.add('done');
        resolve(); return;
      }
      sfx.boop(); b.classList.add('wrong');
      await say(o.hintLine);
      const good = btns.find(x => +x.dataset.n === o.ans); if (good) good.classList.add('hint');
      busy = false;
    }));
  }));

  sfx.yay(); confetti(); o.celebrate(); hop();
  await w(say(o.winLine));
  await w(sleep(250));
}

/* ---------------- game flow ---------------- */
let plan = [];
async function startGame() {
  const id = ++runId, w = makeWaiter(id);
  sfx.unlock();
  plan = buildPlan();
  resetSlots(plan.length);
  clearScene(); face.textContent = ''; tag.textContent = '';
  show('game');
  try {
    await w(say(`Let's play the zero game, ${KID}!`));   // first words happen inside the tap, which unlocks speech on iPhone/iPad
    for (let i = 0; i < plan.length; i++) {
      const r = plan[i];
      clearScene(); setFriend(r.friend);
      await w(sleep(450));
      if (r.type === 'chomp') await chompRound(r, w); else await popRound(r, w);
      await w(earnSticker(i));
      await w(sleep(600));
    }
    await finale(w);
  } catch (e) { if (!(e instanceof Stop)) console.error(e); }
}

async function finale(w) {
  clearScene(); show('finale');
  const hero = $('#finalHero');

  $('#finalText').textContent = `${KID} is a zero superstar!`;
  confetti(40); sfx.yay();
  await w(say(`You did it, ${KID}! You're a zero superstar!`));
  const n = plan.length;
  for (let i = 0; i < n; i++) {
    // sit each sticker right on the zero ring
    const hr = hero.getBoundingClientRect(), rr = hero.querySelector('.zero-ring').getBoundingClientRect();
    const rx = rr.width * 25 / 66, ry = rr.height * 41 / 100;
    const cx = rr.left - hr.left + rr.width / 2, cy = rr.top - hr.top + rr.height / 2;
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;

    s.style.left = cx + rx * Math.cos(a) + 'px';
    s.style.top = cy + ry * Math.sin(a) + 'px';
    hero.append(s); sfx.plop(i % 4);
    await w(sleep(260));
  }
  await w(say('Look! Your stickers made a big zero!'));
  await w(say('Zero means none. All gone!'));
}

$('#installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {}
  deferredPrompt = null; $('#installBtn').hidden = true;
});
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => { if (!isIOS || standalone) $('#offlineNote').hidden = false; })
      .catch(() => {});
  });
}
})();
</script>
</body>
</html>
